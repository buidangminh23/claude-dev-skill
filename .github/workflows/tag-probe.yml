name: Tag probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SUFFIX: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Push a lightweight tag with git
        continue-on-error: true
        run: |
          git tag "probe-light-$SUFFIX" HEAD
          GIT_TRACE_PACKET=1 git push origin "probe-light-$SUFFIX" 2>&1 | grep -aE 'packet: .*(ng |ok |unpack|remote|error)|rejected|error|remote:' | tail -20

      - name: Push an annotated tag with git
        continue-on-error: true
        run: |
          git -c user.name=probe -c user.email=probe@invalid tag -a "probe-annotated-$SUFFIX" -m probe HEAD
          GIT_TRACE_PACKET=1 git push origin "probe-annotated-$SUFFIX" 2>&1 | grep -aE 'packet: .*(ng |ok |unpack|remote|error)|rejected|error|remote:' | tail -20

      - name: Create a tag through the API
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/probe-api-$SUFFIX" -f sha="$GITHUB_SHA" --jq '.ref + " -> " + .object.sha'

      - name: List and remove the probe tags
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for kind in light annotated api; do
            tag="probe-$kind-$SUFFIX"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.ref' > /dev/null 2>&1; then
              echo "$tag exists on GitHub; deleting"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
            else
              echo "$tag was not created"
            fi
          done
