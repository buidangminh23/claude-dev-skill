name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or verify
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release.mjs publish "$TAG"
      - name: Ask Personal Web to refresh its skill cards
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_WEB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PERSONAL_WEB_DISPATCH_TOKEN is not set; the site's daily sync picks this release up."
            exit 0
          fi
          gh api repos/buidangminh23/Personal-Web/dispatches -f event_type=skill-published -F "client_payload[repo]=${{ github.repository }}"
